openapi: "3.0.0"
info:
  title: E-Commerce API
  version: 2.1.0
  description: |
    A comprehensive e-commerce API for managing products, orders, users, and payments.
    Supports both REST and partial GraphQL-like queries.
  termsOfService: https://api.example.com/terms
  contact:
    name: API Support Team
    email: support@example.com
    url: https://api.example.com/support
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://api.example.com/v2
    description: Production server
  - url: https://staging-api.example.com/v2
    description: Staging server
  - url: http://localhost:3000/v2
    description: Local development

tags:
  - name: Products
    description: Product catalog management
  - name: Orders
    description: Order processing and management
  - name: Users
    description: User profile and authentication
  - name: Payments
    description: Payment processing
  - name: Reviews
    description: Product reviews and ratings
  - name: Admin
    description: Admin-only operations

paths:
  # ============================================
  # PRODUCT ENDPOINTS
  # ============================================

  /products:
    get:
      tags: [Products]
      summary: List all products
      description: Get a paginated list of products with optional filtering
      operationId: listProducts
      parameters:
        - name: category
          in: query
          description: Filter by category
          schema:
            type: string
            enum: [electronics, clothing, books, food, beauty]
          example: electronics
        - name: minPrice
          in: query
          description: Minimum price filter
          schema:
            type: number
            format: float
            minimum: 0
          example: 10.99
        - name: maxPrice
          in: query
          description: Maximum price filter
          schema:
            type: number
            format: float
            minimum: 0
          example: 99.99
        - name: inStock
          in: query
          description: Filter by stock availability
          schema:
            type: boolean
          example: true
        - name: sortBy
          in: query
          description: Sort field
          schema:
            type: string
            enum: [price, rating, popularity, newest]
            default: popularity
        - name: order
          in: query
          description: Sort order
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: page
          in: query
          description: Page number for pagination
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Items per page (max 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: fields
          in: query
          description: Comma-separated list of fields to return
          schema:
            type: string
          example: "id,name,price,rating"
      responses:
        "200":
          description: Successful response
          headers:
            X-Total-Count:
              description: Total number of products matching query
              schema:
                type: integer
            X-Page-Count:
              description: Total number of pages
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Product"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

    post:
      tags: [Products, Admin]
      summary: Create a new product
      description: Create a new product. Admin only.
      operationId: createProduct
      security:
        - BearerAuth: []
      requestBody:
        required: true
        description: Product data to create
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
            examples:
              electronics:
                summary: Electronics product
                value:
                  name: "Wireless Headphones"
                  description: "Premium noise-canceling headphones"
                  price: 199.99
                  category: "electronics"
                  brand: "AudioTech"
                  stock: 50
                  images:
                    - "https://example.com/images/headphones-1.jpg"
                    - "https://example.com/images/headphones-2.jpg"
                  specifications:
                    weight: "250g"
                    battery: "30 hours"
                    connectivity: "Bluetooth 5.0"
                  tags: ["wireless", "audio", "premium"]
              book:
                summary: Book product
                value:
                  name: "Programming 101"
                  description: "Comprehensive guide to programming"
                  price: 39.99
                  category: "books"
                  author: "John Doe"
                  publisher: "TechPress"
                  pages: 450
                  stock: 100
                  tags: ["programming", "education", "beginner"]
      responses:
        "201":
          description: Product created successfully
          headers:
            Location:
              description: URL of the created product
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Product with same name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/ServerError"

  /products/{productId}:
    parameters:
      - name: productId
        in: path
        required: true
        description: The unique product ID
        schema:
          type: string
          pattern: "^[0-9a-fA-F]{24}$"
          example: "507f1f77bcf86cd799439011"

    get:
      tags: [Products]
      summary: Get a specific product
      operationId: getProduct
      responses:
        "200":
          description: Product details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
            application/xml:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags: [Products, Admin]
      summary: Update a product
      operationId: updateProduct
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Product updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Conflict - product data conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      tags: [Products, Admin]
      summary: Delete a product
      operationId: deleteProduct
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Product deleted successfully
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /products/{productId}/reviews:
    parameters:
      - $ref: "#/components/parameters/ProductId"

    get:
      tags: [Reviews]
      summary: Get reviews for a product
      operationId: getProductReviews
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: rating
          in: query
          description: Filter by rating
          schema:
            type: integer
            minimum: 1
            maximum: 5
      responses:
        "200":
          description: Product reviews
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Review"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      tags: [Reviews]
      summary: Create a review
      operationId: createReview
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating, title]
              properties:
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                title:
                  type: string
                  minLength: 3
                  maxLength: 100
                comment:
                  type: string
                  maxLength: 1000
                images:
                  type: array
                  maxItems: 5
                  items:
                    type: string
                    format: uri
      responses:
        "201":
          description: Review created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ============================================
  # ORDER ENDPOINTS
  # ============================================

  /orders:
    get:
      tags: [Orders]
      summary: List user orders
      operationId: listOrders
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          description: Filter by order status
          schema:
            type: string
            enum: [pending, processing, shipped, delivered, cancelled]
        - name: fromDate
          in: query
          description: Start date for orders
          schema:
            type: string
            format: date
        - name: toDate
          in: query
          description: End date for orders
          schema:
            type: string
            format: date
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags: [Orders]
      summary: Create a new order
      operationId: createOrder
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items, shippingAddress, paymentMethod]
              properties:
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [productId, quantity]
                    properties:
                      productId:
                        type: string
                      quantity:
                        type: integer
                        minimum: 1
                        maximum: 100
                shippingAddress:
                  $ref: "#/components/schemas/Address"
                paymentMethod:
                  type: string
                  enum: [card, paypal, crypto]
                couponCode:
                  type: string
                notes:
                  type: string
                  maxLength: 500
                giftWrap:
                  type: boolean
                  default: false
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Insufficient stock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /orders/{orderId}:
    parameters:
      - name: orderId
        in: path
        required: true
        description: Order ID
        schema:
          type: string
          pattern: "^ORD-[0-9]{8}-[A-Z0-9]{6}$"
          example: "ORD-20231201-ABC123"

    get:
      tags: [Orders]
      summary: Get order details
      operationId: getOrder
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags: [Orders]
      summary: Update order status
      operationId: updateOrderStatus
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [processing, shipped, delivered, cancelled]
                trackingNumber:
                  type: string
                estimatedDelivery:
                  type: string
                  format: date
      responses:
        "200":
          description: Order updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /orders/{orderId}/cancel:
    post:
      tags: [Orders]
      summary: Cancel an order
      operationId: cancelOrder
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 200
      responses:
        "200":
          description: Order cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Order cannot be cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"

  # ============================================
  # USER ENDPOINTS
  # ============================================

  /auth/register:
    post:
      tags: [Users]
      summary: Register new user
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, firstName, lastName]
              properties:
                email:
                  type: string
                  format: email
                  example: "user@example.com"
                password:
                  type: string
                  format: password
                  minLength: 8
                  pattern: "^(?=.*[a-z])(?=.*[A-Z])(?=.*\\d)"
                  description: At least 8 chars, 1 uppercase, 1 lowercase, 1 number
                firstName:
                  type: string
                  minLength: 1
                  maxLength: 50
                lastName:
                  type: string
                  minLength: 1
                  maxLength: 50
                phone:
                  type: string
                  pattern: "^\\+[1-9]\\d{1,14}$"
                newsletter:
                  type: boolean
                  default: false
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/login:
    post:
      tags: [Users]
      summary: Login user
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                rememberMe:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                    description: JWT access token (expires in 15min)
                  refreshToken:
                    type: string
                    description: JWT refresh token (expires in 7 days)
                  user:
                    $ref: "#/components/schemas/User"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Account locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/refresh:
    post:
      tags: [Users]
      summary: Refresh access token
      operationId: refreshToken
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: New token generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/me:
    get:
      tags: [Users]
      summary: Get current user profile
      operationId: getCurrentUser
      security:
        - BearerAuth: []
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

    patch:
      tags: [Users]
      summary: Update current user profile
      operationId: updateCurrentUser
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                phone:
                  type: string
                avatar:
                  type: string
                  format: uri
                preferences:
                  type: object
                  properties:
                    language:
                      type: string
                      enum: [en, es, fr, de]
                      default: en
                    currency:
                      type: string
                      enum: [USD, EUR, GBP]
                      default: USD
                    notifications:
                      type: object
                      properties:
                        email:
                          type: boolean
                          default: true
                        sms:
                          type: boolean
                          default: false
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/me/addresses:
    get:
      tags: [Users]
      summary: Get user's addresses
      operationId: getUserAddresses
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of addresses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Address"

    post:
      tags: [Users]
      summary: Add new address
      operationId: addUserAddress
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressInput"
      responses:
        "201":
          description: Address added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Address"

  # ============================================
  # PAYMENT ENDPOINTS
  # ============================================

  /payments:
    post:
      tags: [Payments]
      summary: Process payment
      operationId: processPayment
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, paymentMethod]
              properties:
                orderId:
                  type: string
                paymentMethod:
                  type: object
                  required: [type]
                  properties:
                    type:
                      type: string
                      enum: [card, paypal]
                    cardDetails:
                      type: object
                      properties:
                        cardNumber:
                          type: string
                          pattern: "^[0-9]{16}$"
                        expiryDate:
                          type: string
                          pattern: "^[0-9]{2}/[0-9]{2}$"
                        cvv:
                          type: string
                          pattern: "^[0-9]{3,4}$"
                        cardholderName:
                          type: string
                    paypalEmail:
                      type: string
                      format: email
                savePaymentMethod:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Payment successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  paymentId:
                    type: string
                  status:
                    type: string
                    enum: [succeeded, pending, failed]
                  amount:
                    type: number
                  currency:
                    type: string
                  transactionId:
                    type: string
                  receiptUrl:
                    type: string
                    format: uri
        "400":
          $ref: "#/components/responses/BadRequest"
        "402":
          description: Payment failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"

  /payments/{paymentId}/refund:
    post:
      tags: [Payments]
      summary: Refund a payment
      operationId: refundPayment
      security:
        - BearerAuth: []
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                  description: Amount to refund (if not provided, full amount)
                reason:
                  type: string
                  maxLength: 200
      responses:
        "200":
          description: Refund processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  refundId:
                    type: string
                  status:
                    type: string
                    enum: [succeeded, pending]
                  amount:
                    type: number
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  # ============================================
  # ADMIN ENDPOINTS
  # ============================================

  /admin/stats:
    get:
      tags: [Admin]
      summary: Get store statistics
      operationId: getStoreStats
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: period
          in: query
          description: Time period for stats
          schema:
            type: string
            enum: [today, week, month, year]
            default: week
      responses:
        "200":
          description: Store statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: object
                    properties:
                      total:
                        type: integer
                      new:
                        type: integer
                      pending:
                        type: integer
                      shipped:
                        type: integer
                      delivered:
                        type: integer
                  revenue:
                    type: object
                    properties:
                      total:
                        type: number
                      today:
                        type: number
                      week:
                        type: number
                      month:
                        type: number
                  products:
                    type: object
                    properties:
                      total:
                        type: integer
                      lowStock:
                        type: integer
                      outOfStock:
                        type: integer
                  customers:
                    type: object
                    properties:
                      total:
                        type: integer
                      new:
                        type: integer
                      returning:
                        type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/analytics:
    get:
      tags: [Admin]
      summary: Get detailed analytics
      operationId: getAnalytics
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: metric
          in: query
          required: true
          schema:
            type: string
            enum: [sales, traffic, conversion, retention]
        - name: startDate
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: groupBy
          in: query
          description: Group by time interval
          schema:
            type: string
            enum: [day, week, month]
            default: day
      responses:
        "200":
          description: Analytics data
          content:
            application/json:
              schema:
                type: object
                properties:
                  labels:
                    type: array
                    items:
                      type: string
                  datasets:
                    type: array
                    items:
                      type: object
                      properties:
                        label:
                          type: string
                        data:
                          type: array
                          items:
                            type: number
                        backgroundColor:
                          type: string
                        borderColor:
                          type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

# ============================================
# COMPONENTS
# ============================================

components:
  # Security Schemes
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for admin operations

  # Parameters
  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      description: The unique product ID
      schema:
        type: string
        pattern: "^[0-9a-fA-F]{24}$"

    Page:
      name: page
      in: query
      description: Page number for pagination
      schema:
        type: integer
        minimum: 1
        default: 1

    Limit:
      name: limit
      in: query
      description: Items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  # Responses
  responses:
    BadRequest:
      description: Bad request - invalid input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: 400
            message: "Invalid product data"

    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: 401
            message: "Unauthorized - please login"

    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: 403
            message: "Admin access required"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: 404
            message: "Product not found"

    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: 500
            message: "An unexpected error occurred"

  # Schemas
  schemas:
    # Core Models
    Pagination:
      type: object
      properties:
        total:
          type: integer
          description: Total number of items
        page:
          type: integer
          description: Current page number
        limit:
          type: integer
          description: Items per page
        totalPages:
          type: integer
          description: Total number of pages
        hasNext:
          type: boolean
          description: Whether there is a next page
        hasPrevious:
          type: boolean

    Review:
      type: object
      required:
        - id
        - productId
        - userId
        - rating
        - title
      properties:
        id:
          type: string
          description: Review unique identifier
        productId:
          type: string
          description: ID of the product being reviewed
        userId:
          type: string
          description: ID of the user who wrote the review
        rating:
          type: integer
          minimum: 1
          maximum: 5
          description: Rating from 1-5
        title:
          type: string
          minLength: 3
          maxLength: 100
          description: Review title
        comment:
          type: string
          maxLength: 1000
          description: Full review text
        images:
          type: array
          maxItems: 5
          items:
            type: string
            format: uri
          description: Images attached to review
        helpful:
          type: integer
          default: 0
          description: Number of users who found this helpful
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          description: Error code
        message:
          type: string
          description: Error message
        details:
          type: object
          description: Additional error details

    Product:
      type: object
      required:
        - id
        - name
        - price
        - category
      properties:
        id:
          type: string
          description: Product unique identifier
          example: "507f1f77bcf86cd799439011"
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: "Wireless Headphones"
        description:
          type: string
          maxLength: 5000
          example: "Premium wireless headphones with noise cancellation"
        price:
          type: number
          format: float
          minimum: 0
          exclusiveMinimum: true
          example: 199.99
        compareAtPrice:
          type: number
          format: float
          minimum: 0
          description: Original price before discount
          example: 249.99
        category:
          type: string
          enum: [electronics, clothing, books, food, beauty]
          example: "electronics"
        brand:
          type: string
          example: "AudioTech"
        stock:
          type: integer
          minimum: 0
          example: 50
        images:
          type: array
          maxItems: 10
          items:
            type: string
            format: uri
            example: "https://example.com/images/headphones.jpg"
        specifications:
          type: object
          additionalProperties:
            type: string
          example:
            weight: "250g"
            battery: "30 hours"
        rating:
          type: number
          format: float
          minimum: 0
          maximum: 5
          example: 4.5
        reviewCount:
          type: integer
          minimum: 0
          example: 127
        tags:
          type: array
          items:
            type: string
          example: ["wireless", "audio", "premium"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProductInput:
      type: object
      required:
        - name
        - price
        - category
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        price:
          type: number
          minimum: 0
        compareAtPrice:
          type: number
          minimum: 0
        category:
          type: string
          enum: [electronics, clothing, books, food, beauty]
        brand:
          type: string
        stock:
          type: integer
          minimum: 0
          default: 0
        images:
          type: array
          maxItems: 10
          items:
            type: string
            format: uri
        specifications:
          type: object
          additionalProperties:
            type: string
        tags:
          type: array
          items:
            type: string

    ProductUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        price:
          type: number
          minimum: 0
        compareAtPrice:
          type: number
          minimum: 0
        category:
          type: string
          enum: [electronics, clothing, books, food, beauty]
        brand:
          type: string
        stock:
          type: integer
          minimum: 0
        images:
          type: array
          items:
            type: string
            format: uri
        specifications:
          type: object
          additionalProperties:
            type: string
        tags:
          type: array
          items:
            type: string

    Order:
      type: object
      required:
        - id
        - userId
        - items
        - totalAmount
        - status
      properties:
        id:
          type: string
          pattern: "^ORD-[0-9]{8}-[A-Z0-9]{6}$"
          example: "ORD-20231201-ABC123"
        userId:
          type: string
          example: "507f1f77bcf86cd799439011"
        items:
          type: array
          items:
            type: object
            properties:
              productId:
                type: string
              productName:
                type: string
              quantity:
                type: integer
              unitPrice:
                type: number
              totalPrice:
                type: number
        subtotal:
          type: number
          description: Total before tax and shipping
        tax:
          type: number
        shippingCost:
          type: number
        discount:
          type: number
          description: Discount amount
        totalAmount:
          type: number
          description: Final total
        currency:
          type: string
          enum: [USD, EUR, GBP]
          default: USD
        status:
          type: string
          enum: [pending, processing, shipped, delivered, cancelled]
        shippingAddress:
          $ref: "#/components/schemas/Address"
        billingAddress:
          $ref: "#/components/schemas/Address"
        trackingNumber:
          type: string
        estimatedDelivery:
          type: string
          format: date
        paymentStatus:
          type: string
          enum: [pending, paid, failed, refunded]
        paymentMethod:
          type: string
          enum: [card, paypal, crypto]
        notes:
          type: string
        giftWrap:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Address:
      type: object
      required:
        - street
        - city
        - country
        - postalCode
      properties:
        id:
          type: string
        type:
          type: string
          enum: [shipping, billing]
        firstName:
          type: string
        lastName:
          type: string
        company:
          type: string
        street:
          type: string
        apartment:
          type: string
        city:
          type: string
        state:
          type: string
        country:
          type: string
        postalCode:
          type: string
        phone:
          type: string
        isDefault:
          type: boolean

    AddressInput:
      type: object
      required:
        - street
        - city
        - country
        - postalCode
      properties:
        firstName:
          type: string
        lastName:
          type: string
        company:
          type: string
        street:
          type: string
        apartment:
          type: string
        city:
          type: string
        state:
          type: string
        country:
          type: string
        postalCode:
          type: string
        phone:
          type: string
        isDefault:
          type: boolean

    User:
      type: object
      required:
        - id
        - email
        - firstName
        - lastName
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        fullName:
          type: string
        phone:
          type: string
        avatar:
          type: string
          format: uri
        role:
          type: string
          enum: [user, admin, moderator]
          default: user
