      responses:
        '200':
          description: Post updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
    
    patch:
      tags: [Posts]
      summary: Partially update post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
