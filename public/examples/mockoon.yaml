openapi: 3.0.0
info:
  title: Mockoon Playground API
  description: |
    A shared playground for prototyping and testing.
    Supports full CRUD operations with fake data.
    Data is periodically reset.
    Base URL: https://playground.mockoon.com
  version: 1.0.0
  contact:
    name: Mockoon
    url: https://mockoon.com

servers:
  - url: https://playground.mockoon.com
    description: Production server (shared playground)

tags:
  - name: Users
    description: User management
  - name: Posts
    description: Blog posts
  - name: Todos
    description: Todo items
  - name: Movies
    description: Movie catalog
  - name: Companies
    description: Company directory
  - name: Contacts
    description: Contact list
  - name: Customers
    description: Customer management
  - name: Notifications
    description: User notifications
  - name: Photos
    description: Photo gallery
  - name: Pokemons
    description: Pokemon data (read-only)
  - name: Sales
    description: Sales records

paths:
  # ============================================
  # USERS
  # ============================================
  /users:
    get:
      tags: [Users]
      summary: Get all users
      description: Returns a list of all users with optional filtering
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: property_eq
          in: query
          description: Filter by property (e.g., name_eq=John)
          schema:
            type: string
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    
    post:
      tags: [Users]
      summary: Create a new user
      description: Inserts a new user. ID is auto-generated if not provided.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        description: User ID
        schema:
          type: string
        example: "1"
    
    get:
      tags: [Users]
      summary: Get user by ID
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found
    
    put:
      tags: [Users]
      summary: Update entire user
      description: Full object update (replaces existing)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found
    
    patch:
      tags: [Users]
      summary: Partially update user
      description: Partial object update (merges with existing)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                username:
                  type: string
                email:
                  type: string
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found
    
    delete:
      tags: [Users]
      summary: Delete a user
      responses:
        '204':
          description: User deleted
        '404':
          description: User not found

