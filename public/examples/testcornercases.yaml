openapi: 3.0.0
info:
  title: Schema Test API
  version: 1.0.0

servers:
  - url: https://httpbin.org

components:
  schemas:
    User:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        age:
          type: integer
        isActive:
          type: boolean

    Address:
      type: object
      properties:
        street:
          type: string
        city:
          type: string
        zipCode:
          type: string
          pattern: "^[0-9]{5}$"

    UserWithAddress:
      allOf:
        - $ref: '#/components/schemas/User'
        - $ref: '#/components/schemas/Address'

    SearchResult:
      anyOf:
        - type: string
        - type: integer

    Animal:
      oneOf:
        - $ref: '#/components/schemas/Dog'
        - $ref: '#/components/schemas/Cat'
      discriminator:
        propertyName: type

    Post:
      type: object
      required: [id, title]
      properties:
        id:
          type: integer
        title:
          type: string
        author:
          $ref: '#/components/schemas/User'
        tags:
          type: array
          items:
            type: string

    TreeNode:
      type: object
      properties:
        id:
          type: integer
        label:
          type: string
        children:
          type: array
          items:
            $ref: '#/components/schemas/TreeNode'

    NullableString:
      type: string
      nullable: true

    Status:
      type: string
      enum: [pending, active, inactive, deleted]

    Metadata:
      type: object
      additionalProperties:
        type: string

    Vehicle:
      oneOf:
        - type: object
          properties:
            type:
              type: string
              enum: [car]
            doors:
              type: integer
            engine:
              type: string
          required: [type, doors, engine]
        - type: object
          properties:
            type:
              type: string
              enum: [motorcycle, truck]
            wheels:
              type: integer
          required: [type, wheels]

    ExtendedUser:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            role:
              type: string
            department:
              type: string

    Dog:
      type: object
      required: [type, breed]
      properties:
        type:
          type: string
          enum: [dog]
        breed:
          type: string
        barkVolume:
          type: number

    Cat:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [cat]
        furColor:
          type: string
        livesLeft:
          type: integer

paths:
  # ===== TEST 1: Basic CRUD with $ref =====
  # Tests: $ref in request body and response
  /1-users:
    post:
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  # ===== TEST 2: allOf merging =====
  # Tests: allOf combines User + Address
  /2-users-with-address:
    post:
      summary: Create user with address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserWithAddress'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserWithAddress'

  # ===== TEST 3: anyOf (union type) =====
  # Tests: anyOf in query param and response
  /3-search:
    get:
      summary: Search (anyOf)
      parameters:
        - name: query
          in: query
          schema:
            anyOf:
              - type: string
              - type: integer
      responses:
        '200':
          description: Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResult'

  # ===== TEST 4: oneOf with discriminator =====
  # Tests: oneOf + discriminator
  /4-animal:
    get:
      summary: Get animal (oneOf)
      responses:
        '200':
          description: Animal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Animal'

  # ===== TEST 5: nested objects and arrays =====
  # Tests: nested $ref, arrays, nested objects
  /5-posts:
    get:
      summary: Get posts (nested)
      responses:
        '200':
          description: List of posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'

  # ===== TEST 6: circular reference =====
  # Tests: recursive TreeNode (circular)
  /6-tree:
    get:
      summary: Get tree (circular)
      responses:
        '200':
          description: Tree structure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TreeNode'

  # ===== TEST 7: nullable field =====
  # Tests: nullable: true
  /7-nullable:
    get:
      summary: Get nullable string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullableString'

  # ===== TEST 8: enum =====
  # Tests: enum values
  /8-status:
    get:
      summary: Get status (enum)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'

  # ===== TEST 9: additionalProperties =====
  # Tests: dynamic object keys
  /9-metadata:
    get:
      summary: Get metadata (additionalProperties)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metadata'

  # ===== TEST 10: oneOf with conditional validation =====
  # Tests: Vehicle oneOf (car vs motorcycle/truck)
  /10-vehicle:
    get:
      summary: Get vehicle (oneOf)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'

  # ===== TEST 11: allOf + $ref + extra fields =====
  # Tests: ExtendedUser (allOf with $ref)
  /11-extended-user:
    get:
      summary: Get extended user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtendedUser'