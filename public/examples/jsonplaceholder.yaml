openapi: 3.0.0
info:
  title: Complete Test API Suite
  description: |
    A comprehensive test API using real, live endpoints.
    Supports all HTTP methods, parameters, request bodies, and response types.
  version: 1.0.0
  contact:
    name: API Support
    email: test@example.com

servers:
  - url: https://jsonplaceholder.typicode.com
    description: JSONPlaceholder - Best for CRUD operations
  - url: https://httpbin.org
    description: HTTPBin - Best for testing HTTP methods and status codes
  - url: https://api.open-meteo.com/v1
    description: Open-Meteo - Best for testing query parameters

tags:
  - name: Users
    description: User management (GET, POST, PUT, PATCH, DELETE)
  - name: Posts
    description: Post management (GET, POST, PUT, DELETE)
  - name: Comments
    description: Comment management (GET, POST)
  - name: Files
    description: File uploads and downloads
  - name: Weather
    description: Weather data with complex query parameters
  - name: Status
    description: HTTP status code testing

paths:
  # ============================================
  # USERS - Full CRUD operations
  # ============================================
  
  /users:
    get:
      tags: [Users]
      summary: Get all users
      description: Returns a list of users with optional pagination
      operationId: getUsers
      parameters:
        - name: _page
          in: query
          description: Page number for pagination
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: _limit
          in: query
          description: Items per page (max 50)
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
          example: 5
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    post:
      tags: [Users]
      summary: Create a new user
      description: Creates a new user with the provided data
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
            examples:
              john:
                summary: John Doe
                value:
                  name: John Doe
                  username: johndoe
                  email: john@example.com
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        description: Unique user identifier
        schema:
          type: integer
          minimum: 1
        example: 1
    
    get:
      tags: [Users]
      summary: Get user by ID
      description: Returns a single user by their ID
      operationId: getUserById
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    put:
      tags: [Users]
      summary: Update entire user
      description: Replaces the user with new data
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found
    
    patch:
      tags: [Users]
      summary: Partially update user
      description: Updates specific fields of a user
      operationId: patchUser
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                username:
                  type: string
      responses:
        '200':
          description: User partially updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found
    
    delete:
      tags: [Users]
      summary: Delete a user
      description: Removes a user from the system
      operationId: deleteUser
      responses:
        '200':
          description: User deleted
        '404':
          description: User not found

  # ============================================
  # POSTS - Complex requests with query params
  # ============================================
  
  /posts:
    get:
      tags: [Posts]
      summary: Get all posts
      description: Returns a list of posts with optional filters
      operationId: getPosts
      parameters:
        - name: userId
          in: query
          description: Filter posts by user ID
          schema:
            type: integer
          example: 1
        - name: _page
          in: query
          description: Page number
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: _limit
          in: query
          description: Items per page
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: List of posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
    
    post:
      tags: [Posts]
      summary: Create a new post
      description: Creates a new blog post
      operationId: createPost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - body
              properties:
                title:
                  type: string
                  minLength: 3
                  maxLength: 100
                  example: "My New Post"
                body:
                  type: string
                  minLength: 10
                  maxLength: 1000
                  example: "This is the content of my new post..."
                userId:
                  type: integer
                  example: 1
      responses:
        '201':
          description: Post created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: Invalid input

  /posts/{postId}:
    parameters:
      - name: postId
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
        example: 1
    
    get:
      tags: [Posts]
      summary: Get post by ID
      operationId: getPostById
      responses:
        '200':
          description: Post found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '404':
          description: Post not found
    
    put:
      tags: [Posts]
      summary: Update entire post
      operationId: updatePost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - body
              properties:
                title:
                  type: string
                body:
                  type: string
      responses:
        '200':
          description: Post updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
    
    delete:
      tags: [Posts]
      summary: Delete a post
      operationId: deletePost
      responses:
        '200':
          description: Post deleted
        '404':
          description: Post not found

  # ============================================
  # COMMENTS - Nested resources
  # ============================================
  
  /comments:
    get:
      tags: [Comments]
      summary: Get all comments
      parameters:
        - name: postId
          in: query
          description: Filter comments by post
          schema:
            type: integer
        - name: _page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: List of comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
    
    post:
      tags: [Comments]
      summary: Create a comment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - postId
                - name
                - body
              properties:
                postId:
                  type: integer
                name:
                  type: string
                email:
                  type: string
                  format: email
                body:
                  type: string
      responses:
        '201':
          description: Comment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'

  # ============================================
  # WEATHER - Complex query parameters
  # ============================================
  
  /forecast:
    get:
      tags: [Weather]
      summary: Get weather forecast
      description: Returns current weather and forecast for a location
      operationId: getWeather
      parameters:
        - name: latitude
          in: query
          required: true
          description: Latitude of the location
          schema:
            type: number
            format: float
            minimum: -90
            maximum: 90
          example: 52.52
        - name: longitude
          in: query
          required: true
          description: Longitude of the location
          schema:
            type: number
            format: float
            minimum: -180
            maximum: 180
          example: 13.41
        - name: current_weather
          in: query
          description: Include current weather
          schema:
            type: boolean
            default: true
        - name: temperature_unit
          in: query
          description: Temperature unit
          schema:
            type: string
            enum: [celsius, fahrenheit]
            default: celsius
        - name: timezone
          in: query
          description: Timezone for the forecast
          schema:
            type: string
            default: auto
          example: Europe/Berlin
        - name: forecast_days
          in: query
          description: Number of forecast days
          schema:
            type: integer
            minimum: 1
            maximum: 16
            default: 7
      responses:
        '200':
          description: Weather data
          content:
            application/json:
              schema:
                type: object
                properties:
                  latitude:
                    type: number
                  longitude:
                    type: number
                  current_weather:
                    type: object
                    properties:
                      temperature:
                        type: number
                      windspeed:
                        type: number
                      weathercode:
                        type: integer
        '400':
          description: Invalid parameters

  # ============================================
  # STATUS CODES - For testing error handling
  # ============================================
  
  /status/{code}:
    parameters:
      - name: code
        in: path
        required: true
        description: HTTP status code to return
        schema:
          type: integer
          enum: [200, 400, 401, 403, 404, 500, 502, 503]
    
    get:
      tags: [Status]
      summary: Return specific status code
      description: Useful for testing error handling in your app
      operationId: getStatus
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Server Error
        '502':
          description: Bad Gateway
        '503':
          description: Service Unavailable

  # ============================================
  # FILE UPLOAD TEST
  # ============================================
  
  /post:
    post:
      tags: [Files]
      summary: Test file upload (multipart/form-data)
      description: Uploads a file with optional metadata
      operationId: uploadFile
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The file to upload
                name:
                  type: string
                  description: Optional file name
      responses:
        '200':
          description: File uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: object
                  form:
                    type: object

components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: John Doe
        username:
          type: string
          example: johndoe
        email:
          type: string
          format: email
          example: john@example.com
        phone:
          type: string
          example: 1-770-736-8031 x56442
        website:
          type: string
          example: john.doe.com
    
    UserInput:
      type: object
      required:
        - name
        - email
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: John Doe
        username:
          type: string
          minLength: 3
          maxLength: 20
          example: johndoe
        email:
          type: string
          format: email
          example: john@example.com
    
    Post:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        title:
          type: string
        body:
          type: string
    
    Comment:
      type: object
      properties:
        id:
          type: integer
        postId:
          type: integer
        name:
          type: string
        email:
          type: string
        body:
          type: string
    
    Error:
      type: object
      properties:
        message:
          type: string
          example: Something went wrong
        code:
          type: integer
          example: 500